services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: reglab_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      # ИСПРАВЛЕНО: абсолютный путь Windows заменён на переменную окружения.
      # Задайте QDRANT_STORAGE_PATH в .env или перед запуском:
      #   export QDRANT_STORAGE_PATH=./qdrant_storage   (Linux/macOS)
      #   set QDRANT_STORAGE_PATH=.\qdrant_storage      (Windows CMD)
      # По умолчанию данные хранятся в папке ./qdrant_storage рядом с docker-compose.yml
      - ${QDRANT_STORAGE_PATH:-./qdrant_storage}:/qdrant/storage
    restart: unless-stopped
