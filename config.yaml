# ==========================================
# ⚙️ КОНФИГУРАЦИЯ RAG СИСТЕМЫ
# ==========================================
# Версия: 2.1 (исправлены несоответствия со скриптами)
# Дата обновления: 2026-05-05

# === ОКРУЖЕНИЕ ===
environment: "development"  # development | staging | production

# === ПРОВАЙДЕРЫ LLM (унифицированная конфигурация) ===
providers:
  llm:
    # Активный провайдер: groq | gemini | gigachat | ollama
    active: "groq"
    
    # Таймауты и повторные попытки
    timeout_seconds: 30
    max_retries: 3
    
    # Конфигурация для каждого провайдера
    configs:
      # ===== GROQ (Рекомендуется для быстроты) =====
      groq:
        model: "openai/gpt-oss-120b" # openai/gpt-oss-120b | meta-llama/llama-4-scout-17b-16e-instruct
        base_url: "https://api.groq.com/openai/v1"
        api_keys: "${GROQ_API_KEYS}"  # Загружается из .env (список через запятую)
        description: "Быстрая облачная LLM от Groq (рекомендуется)"
      
      # ===== GEMINI (Мощная, поддерживает function_calling) =====
      gemini:
        model: "gemini-3.5-flash" #gemma-4-26b-a4b-it , gemini-2.5-flash
        api_keys: "${GOOGLE_API_KEYS}"  # Загружается из .env
        description: "Google Gemini - мощная и быстрая"
      
      # ===== GIGACHAT (Русский язык) =====
      gigachat:
        model: "GigaChat-2"
        credentials: "${GIGACHAT_CREDENTIALS}"  # Загружается из .env (JSON)
        verify_ssl: false
        description: "GigaChat - специализирована для русского языка"
      
      # ===== OLLAMA (Локальная LLM) =====
      ollama:
        model: "qwen3:8b"
        base_url: "http://localhost:11434/v1"  # Переопределяется для production
        description: "Локальная LLM (требует Ollama на машине)"

# === БАЗЫ ДАННЫХ (Унифицированная конфигурация) ===
storage:
  vector_db:
    # Активная база: qdrant_v2_docker | qdrant_v1 | qdrant_tickets_test
    active: "qdrant_v2_docker"
    second_db: "qdrant_tickets_enriched"
    # Глобальные таймауты
    timeout_seconds: 10
    
    # Конфигурация для каждой БД
    backends:
      # ===== Qdrant V2 (Docker) - основная =====
      qdrant_v2_docker:
        type: "qdrant"
        url: "http://localhost:6333"  # Docker контейнер
        collection: "reglab_tech_docs_v2_prefix_v2_prefix" # reglab_tech_docs_v2_prefix | reglab_tech_docs_v2_prefix_v2_prefix
        
        # Хранилище для родительских документов
        parent_store:
          type: "sqlite"
          path: "vector_dbs/qdrant_v2_qwen3_hybrid/parents.db"
        
        description: "Основная база (Docker), гибридный поиск"
      
      # ===== Qdrant V1 (локальная) =====
      qdrant_v1:
        type: "qdrant"
        path: "data/vector_dbs/qdrant_v1_qwen3_hybrid"
        collection: "tech_docs_reglab"
        
        parent_store:
          type: "sqlite"
          path: "data/vector_dbs/qdrant_v1_qwen3_hybrid/parent_docstore"
        
        description: "Локальная Qdrant V1"
      
      # ===== Qdrant для тикетов (тестирование) =====
      qdrant_tickets_test:
        type: "qdrant"
        url: "http://localhost:6333"
        collection: "tickets_test_collection"
        
        parent_store:
          type: "sqlite"
          path: "vector_dbs/tickets_test/parents.db"
        
        description: "Для тестирования поиска по тикетам"

      qdrant_tickets_filtered:
        type: "qdrant"
        url: "http://localhost:6333"
        collection: "tickets_filtered_collection"

        parent_store:
          type: "sqlite"
          path: "vector_dbs/tickets_filtered/parents.db"

        description: "Очищенная отдельная база исторических тикетов"
      
      qdrant_tickets_enriched:
        type: "qdrant"
        url: "http://localhost:6333"
        collection: "tickets_enriched_collection"

        parent_store:
          type: "sqlite"
          path: "vector_dbs/tickets_enriched/parents.db"

        description: "Очищенная база тикетов с авто-тегами и модулями"

# === МОДЕЛИ (Эмбеддинги и реранкеры) ===
models:
  embedding:
    # Активная модель: qwen3 | bge_m3 | e5_large
    active: "qwen3"
    device: "cuda"  # cuda | cpu
    
    # Доступные модели эмбеддингов
    available:
      qwen3:
        name: "Qwen/Qwen3-Embedding-0.6B"
        dimension: 1024
        languages: ["russian", "english", "multilingual"]
        notes: "Легкая, быстрая, мультиязычная"
      
      bge_m3:
        name: "BAAI/bge-m3"
        dimension: 1024
        languages: ["russian", "english", "multilingual"]
        notes: "Мощная, поддерживает BM25 разреживание"
      
      e5_large:
        name: "intfloat/multilingual-e5-large"
        dimension: 1024
        languages: ["russian", "english", "multilingual"]
        notes: "Качественная для мультиязычного поиска"

  reranker:
    # Активный реранкер
    active: "bge_v2_m3"
    
    # Доступные реранкеры
    available:
      bge_base:
        name: "BAAI/bge-reranker-base"
        notes: "Легкий реранкер"
      
      bge_large:
        name: "BAAI/bge-reranker-large"
        notes: "Более мощный реранкер"
      
      bge_v2_m3:
        name: "BAAI/bge-reranker-v2-m3"
        notes: "Лучший для мультиязычных текстов (рекомендуется)"

# === RETRIEVAL (Поиск и ранжирование) ===
retrieval:
  # Параметры поиска
  top_k_retrieval: 30      # Сколько чанков достать из БД
  top_k_final: 3           # Сколько финальных документов отправить в LLM
  rerank_threshold: 0.05   # Минимальный score после реранжирования
  
  use_reranker: true      # Загружать и использовать реранкер (false = выключить, использовать порядок векторного скора)
  use_litm: true           # Использовать Lost-in-the-Middle сортировку
  use_hyde: false          # Использовать HyDE (Hypothetical Document Embeddings)
  multi_query:
    # RAG-Fusion: исходный запрос + варианты от LLM, RRF-слияние, затем один реранкер.
    # Выключено по умолчанию: включает LLM-вызов и до 2 дополнительных поисков в каждую БД.
    enabled: true
    max_generated_queries: 2
    rrf_k: 60
    max_candidates: 60
    structured_planner:
      # Раздельная декомпозиция запроса для документации и исторических тикетов.
      # Пока выключена: false сохраняет прежний общий список перефразирований.
      enabled: false
      max_documentation_queries: 3
      max_ticket_queries: 3
      query_aware_rerank:
        # Experimental: score RRF candidates against both the original question
        # and the generated queries that retrieved them.
        enabled: false
        original_query_weight: 1.0
        generated_query_weight: 1.0
        max_reserved_queries: 2
        per_query_quota: 1
  diagnostic_sgr:
    # Второй SGR-этап только для диагностических вопросов: оценивает доказательства и при необходимости уточняет поиск.
    enabled: true
    max_followup_queries: 2
  
  # Параметры чанкинга (Parent-Child)
  chunking:
    child_chunk_size: 400      # Размер чанка для поиска
    child_chunk_overlap: 50    # Перекрытие между чанками
    description: "Меньшие чанки для поиска, больше контекста из родителя"

# === ПРИЛОЖЕНИЯ (разные юзкейсы) ===
rag_profiles:
  fast:
    use_reranker: false
    top_k_retrieval: 16
    top_k_final: 3
    rerank_threshold: 0.05
    use_litm: false
  deep:
    use_reranker: true
    top_k_retrieval: 24
    top_k_final: 4
    rerank_threshold: 0.05
    use_litm: true
  chat:
    use_reranker: false
    top_k_retrieval: 12
    top_k_final: 3
    rerank_threshold: 0.05
    use_litm: false
  chat_deep:
    use_reranker: true
    top_k_retrieval: 20
    top_k_final: 4
    rerank_threshold: 0.05
    use_litm: true


applications:
  # ===== QA система (основное приложение) =====
  qa_system:
    name: "Основная Q&A система"
    llm: "groq"                    # Ссылается на providers.llm.configs
    embedding: "qwen3"             # Ссылается на models.embedding.available
    vector_db: "qdrant_v2_docker"  # Ссылается на storage.vector_db.backends
    description: "Основная RAG система для ответов на вопросы"
  
  # ===== Система обработки тикетов =====
  support_tickets:
    name: "Обработка технических тикетов"
    llm: "ollama"                  # Режим обогащения тикетов: ollama | api
    embedding: "qwen3"
    vector_db: "qdrant_tickets_test"
    
    # Параметры для обработки тикетов
    processing:
      llm_prompt: "Выдели симптомы проблемы, шаги диагностики и решение из текста технического тикета:\n\n"
      indexing_prefix: "Техническое обращение: диагностика и решение проблемы оборудования АstraRegul."
      root_breadcrumb: "Техподдержка > РегЛаб >"
      # Включить LLM-обогащение метаданных (symptoms/solution) для закрытых тикетов
      # ВНИМАНИЕ: при включении каждый закрытый тикет делает запрос к LLM — увеличивает время ингеста
      enable_smart_metadata: false
      # Для llm: "api" ключи перебираются сначала по Gemini, затем по Groq.
      api_provider_order: ["gemini", "groq"]
    
    description: "Система для анализа и индексирования технических обращений"
  
  # ===== Система оценки ответов =====
  evaluation:
    name: "Автоматическая оценка качества ответов"
    judge_llm: "gemini"            # LLM для проверки корректности ответов
    threshold_cosine: 0.82         # Порог косинусного сходства
    description: "Система для оценки качества ответов RAG"

# === ДАННЫЕ И ПУТИ (все пути в одном месте) ===
data:
  # Локальные исходные директории (для ингеста)
  # ВАЖНО: ключ "support_tickets" (без _json) — именно так его ищет run_ingest_qdrant.py
  source_directories:
    r500_docx: "data/source_docs/docs_word/R500"
    r500s_docx: "data/source_docs/docs_word/r500s"
    metod_docx: "data/source_docs/docs_word/metod"
    
    r500_html: "data/source_docs/docs_html/RX00 HTML"
    astraregul_html: "data/source_docs/docs_html/Astra.Documentation"
    
    # Ключ должен называться "support_tickets" — скрипт ингеста ищет именно его
    support_tickets: "data/source_docs/docs_json/tickets"
  
  # Удалённые источники (base URL для HTML-ссылок в документах)
  # Ключи: <source_type>_url, config.py приводит их к виду <source_type>
  remote_sources:
    r500_html_url: "https://reglab.ru/upload/materialy-kursa/"
    astraregul_html_url: "https://reglab.ru/upload/rukovodstvo-polzovatelya/"
    support_tickets_url: "https://support.reglab.ru/tasks/"
  
  # Кэши и вспомогательные файлы
  caches:
    hash_registry: "data/file_hashes_qdrant.json"    # Реестр хэшей (для отслеживания изменений)
    bm25_cache: "data/bm25_caches/cache.pkl"          # Кэш BM25 индексов
    images_output: "data/persistent_images"           # Сохранённые изображения из документов

# === АВТОТЕСТИРОВАНИЕ ===
testing:
  # Лимит вопросов на файл (null = обрабатывать все)
  max_questions_per_file: 20

# === ИНТЕРФЕЙС (Streamlit) ===
ui:
  show_manual_filter: false  # Показывать фильтр по оборудованию

# === ОТЛАДКА И ПРОФИЛИРОВАНИЕ ===
debug:
  enable_profiling: false # Включить таймеры для каждого компонента
  log_level: "INFO"        # DEBUG | INFO | WARNING | ERROR
  
  # При необходимости дебага:
  # enable_profiling: true
  # log_level: "DEBUG"

# === ЛОГИРОВАНИЕ ВОПРОСОВ (полный аудит) ===
# Управляется через src/logger.py — см. QUICKSTART.md
# При log_level: DEBUG в файл пишется полный контекст каждого запроса.

# === ТРЕБУЕМЫЕ ПЕРЕМЕННЫЕ ОКРУЖЕНИЯ ===
# Перед запуском убедитесь, что эти переменные установлены в .env:
#
# GROQ_API_KEYS=key1,key2,key3              # Список ключей GROQ (запятая разделяет)
# GOOGLE_API_KEYS=key1,key2                 # Список ключей Google Gemini
# GIGACHAT_CREDENTIALS={"key": "value"}     # JSON с учетными данными GigaChat
#
# Если в .env переменная не найдена, будет ошибка при инициализации!

# === ЭКСПЕРИМЕНТАЛЬНЫЙ AGENTIC RAG ===
# Публикуется в OpenWebUI как reglab-ai-agentic и также доступен через scripts/run_agentic_rag.py.
agentic_rag:
  enabled: true
  max_rounds: 3
  max_tool_calls: 6
  max_queries_per_round: 2
  timeout_seconds: 90
  expose_trace: true
  docs_context_max_chars: 4000
  tickets_context_max_chars: 3000
  doc_max_chars: 1800
  ticket_max_chars: 1400
